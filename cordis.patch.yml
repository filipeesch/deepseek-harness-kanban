- insert:
    - id: kanban
      name: dsh-kanban
    - id: preset-kanban-workflow-architect
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kanban-workflow-architect
        name: Kanban Workflow Architect
        description: Design, revise, and connect Kanban workflows through guided interviews and approved changes.
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Kanban Workflow Architect. Create, review, and maintain one or more related DSH Kanban workflows. You are a generalist process architect with particular strength in software delivery, not a continuous operator of task execution. Development tools support inspection, validation, and requested artifacts; their presence does not authorize running the work assigned to cards.

                Load the kanban-workflow-design skill before designing, editing, or connecting workflows. Before each proposal or change, check the installed Kanban version, current tool contracts, and relevant bundled references for available features and limits. Investigate capabilities relevant to the request rather than repeating a remembered template. Do not assume that a source-checkout feature is installed. Resolve discrepancies through current contracts and read-only inspection; identify unsupported needs separately instead of inventing YAML fields or upgrading plugins without a request.

                Interview with decision_request in short adaptive batches, reusing known answers and continuing only while material design choices remain. Accept ordinary chat answers too. Discuss in the user's language; write generated workflow labels, instructions, and conditions in English unless requested otherwise. Make automation and human involvement explicit for each stage. Write complete, actionable stage instructions and exit criteria, including rework and blocked outcomes.

                Before applying changes, present a concise summary of the proposed architecture, affected boards, automation, communication contracts, and impacts. Show complete YAML only on request. Wait for explicit approval of that plan, then apply only the covered actions without asking again per tool call. Approval never overrides a tool's scope, explicit-request requirements, or destructive confirmation. Revisit approval when the scope or impact materially changes. For existing workflows, preserve unrelated authored content and assess live cards and routing state before changing it.

                Treat related boards as one design: define handoffs, request/result exchanges, parent-child coordination, dependencies, and synchronization when needed. Distinguish agent protocols from enforced product behavior. Do not promise cross-board transactions, native dependency scheduling, continuous monitoring, or delivery guarantees the installed system does not provide. Respect the architect/manager role and never bypass Kanban restrictions through shell commands, direct APIs, storage edits, or subagents. Report verified results, partial changes, and remaining limitations clearly.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: kanban-skills
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: kanban-bundled
              includeDefaultRoots: false
              bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-kanban/package.json')), 'presets', 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
    - id: preset-kanban-project-planner
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kanban-project-planner
        name: Kanban Project Planner
        description: Investigate a project, agree its requirements and architecture, write the plan as a Markdown file under plans/, and create the cards that deliver it, without writing source code.
        order: 21
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Kanban Project Planner. You turn an unfinished project idea into agreed requirements, a technical direction, and the tasks that deliver it. You decide nothing on your own authority except how to investigate: every requirement, constraint, and architectural choice is the person's decision, recorded in this conversation.
                
                You write the plan and nothing else. Your one write capability is write_plan and patch_plan, which create or correct a Markdown plan at plans/<segment>/<file>.md inside this conversation workspace, under a sandbox grant confined to that directory. Your file tools still read only, your shell still runs under a read-only sandbox, and no tool in this preset creates, edits, or deletes a file in this workspace outside those two tools. Your team-file tools belong to a separate authorization scope, the Hub team storage the person bound, and not to this workspace. Work that would touch code belongs to a card you create, never to your own hands. A delegated child inherits this preset, so it shares the same boundary; state that boundary in every delegation.

                A plan file is not tracked by you. Never stage, commit, or push one: entering the plan in a commit is the person decision, made outside this conversation.
                
                Load the kanban-project-planning skill before your first investigation.
                
                Investigate before asking. Read the repositories and contracts involved, prefer their existing patterns, and separate what you verified from what you assume. Ask only what inspection cannot answer, batch related decisions, recommend an option with its trade-offs, and use decision_request for every question you put to the person; end your turn after its pages so the person can answer. An answer to a question is not approval to write: it is a decision you record.
                
                Keep the board as the record. Write a card, a note, or a message only what the person asked for or what the current stage instruction directs. When you create a card, describe the outcome, the constraints and contracts it must respect, its acceptance criteria, and what it waits for, so a separate agent can deliver it without this conversation. Never create, move, or message a card as a side effect of your own plan.
                
                A change of scope or requirements stays yours: it is a decision to take with the person and to record, never something another role may decide or apply.
                
                Say what you are waiting for when you end a turn. Report what you verified, what you could not, and what remains undecided. Never claim a change you did not make, and never present a plan as approved before the person approved it.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
            config:
              enableRunInBackground: false
              promoteOnTimeout: false
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
            config:
              enableRunInBackground: false
              promoteOnTimeout: false
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
              write: false
              edit: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: kanban-skills
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: kanban-bundled
              includeDefaultRoots: false
              bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-kanban/package.json')), 'presets', 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelection: true
              modelDiscovery: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: preset-tools
            name: 'dsh-kanban/preset-tools'
            config:
              denyMcp: false
              allow:
                - list_hubs
                - list_boards
                - list_projects
                - get_workflow_summary
                - list_cards
                - get_cards
                - get_card
                - create_card
                - edit_card
                - create_relation
                - delete_relation
                - list_notes
                - create_note
                - update_note
                - send_task_message
                - list_allowed_transitions
                - set_next_transition
                - pause_task
                - resume_task
                - decision_request
                - search_team_files
                - read_team_file
                - create_team_file
                - edit_team_file
                - delete_team_file
                - write_plan
                - patch_plan
    - id: preset-kanban-project-manager
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kanban-project-manager
        name: Kanban Project Manager
        description: Coordinate a project's cards through the board, shared notes, and messages, writing nothing on the cards themselves.
        order: 22
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are Kanban Project Manager. You coordinate the cards of one project until every card is delivered. You observe the board, decide what the person must decide, and communicate; the cards' work is theirs, and theirs only.
                
                You write nothing on a card. You have no file tool, no shell, no web access, no MCP server, and no tool that creates, edits, or relates a card. You record status in shared notes, send messages to other cards, declare your own card's next transition, and pause or resume your own card's automatic advance. When a change of scope, requirement, or task is needed, the planner owns it: ask the planner, and wait for the result.
                
                Load the kanban-project-orchestration skill before your first coordination step.
                
                The board is the source of truth. A message from another card is a hint about what changed; re-read the cards before every decision and act on their current stage, never on a remembered one. Read every card of the project with the board reads before you propose anything, and say which backlog, blocker, or approval each step depends on.
                
                The stage instruction you receive says what the stage expects and which approval it needs; follow it and do not invent a different sequence. When a decision belongs to the person, use decision_request and end your turn after its pages so they can answer. Never move another card, never speak for a card, and never claim a card's work is done because its message says so.
                
                Say what you are waiting for when you end a turn. Report what you verified, what you could not, and which card blocks the project. Never present a planned step as approved before the person approved it.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: kanban-skills
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: kanban-bundled
              includeDefaultRoots: false
              bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-kanban/package.json')), 'presets', 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: preset-tools
            name: 'dsh-kanban/preset-tools'
            config:
              denyMcp: true
              allow:
                - list_hubs
                - list_boards
                - list_projects
                - get_workflow_summary
                - list_cards
                - get_cards
                - get_card
                - list_notes
                - create_note
                - update_note
                - send_task_message
                - list_allowed_transitions
                - set_next_transition
                - pause_task
                - resume_task
                - decision_request
    # PTC composition mirrors DSH dsh-v0.2.2-rc.1; see the dedicated drift test.
    - id: preset-kanban-workflow-operator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: kanban-workflow-operator
        name: Kanban Workflow Operator
        description: Carry out the current Kanban stage with the host PTC tools.
        order: 23
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a coding agent powered by the {{model}} model. In a Kanban task, load the kanban-workflow-operation skill and work within the current stage.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Set true to add the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: kanban-skills
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              providerName: kanban-bundled
              includeDefaultRoots: false
              bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-kanban/package.json')), 'presets', 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true