name: Release

# Publishes the installable plugin artifact whenever a pull request lands on
# main. The asset name is part of the public install contract: the README
# installs from /releases/latest/download/dsh-kanban.tgz, so every release
# must publish exactly that file name.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.15.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check

      - name: Pack the plugin
        run: pnpm pack --pack-destination dist

      - name: Use the stable asset name
        run: cp dist/dsh-kanban-*.tgz dsh-kanban.tgz

      - name: Publish the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dsh-kanban.tgz --clobber
          else
            gh release create "$tag" dsh-kanban.tgz \
              --title "$tag" \
              --generate-notes
          fi
