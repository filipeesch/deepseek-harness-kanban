name: Release

# Publishes the installable plugin artifact whenever a pull request lands on
# main. The asset name is part of the public install contract: the README
# installs from /releases/latest/download/dsh-kanban.tgz, so every release
# must publish exactly that file name. A release is immutable: the workflow
# refuses to publish a version whose tag already exists, so the manifest
# version must be bumped in the pull request that changes the artifact.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    # Only the merged main commit is published, including manual dispatches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the merged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.15.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refuse an already published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          refusal="Bump \"version\" in package.json in the pull request that changes the artifact and merge again."
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 || tag_status=$?
          if [ "$tag_status" -eq 0 ]; then
            echo "::error::Tag $tag already exists. $refusal"
            exit 1
          fi
          if [ "$tag_status" -ne 2 ]; then
            echo "::error::Could not determine whether tag $tag exists (git ls-remote exited $tag_status)."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. $refusal"
            exit 1
          fi

      - name: Verify
        run: pnpm check

      - name: Pack the plugin
        run: pnpm pack --pack-destination dist

      - name: Use the stable asset name
        run: cp dist/dsh-kanban-*.tgz dsh-kanban.tgz

      - name: Publish the release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          gh release create "$tag" dsh-kanban.tgz \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
