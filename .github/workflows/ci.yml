name: CI

# Verification-only pipeline: it runs every CI-safe test lane of the solution
# and produces no distributable artifact. The gates are the fast lanes defined
# in AGENTS.md — `pnpm run check` (host typecheck, client typecheck, the vitest
# suite, and the local build) and `pnpm run test:browser` (the plugin-owned
# Playwright harness). The real-composition lane (`scripts/e2e-dsh.mjs`) stays
# manual because it needs an installed and built DSH checkout on the runner; no
# lane here may call a real model.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.15.1"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck, unit test, and build
        run: pnpm run check

      - name: Run the browser harness
        run: pnpm run test:browser
